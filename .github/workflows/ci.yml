name: CI

on:
  push:
    branches: [main]
  pull_request:

# least-privilege default for every job below - none of them push, publish,
# or otherwise need more than reading the checked-out code
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install python dependencies
        run: uv sync --locked --dev

      - name: black
        run: make checkblack

      - name: ruff
        run: make checkruff

      - name: mypy
        run: make mypy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install python dependencies
        run: uv sync --locked --dev

      - name: pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: make build
