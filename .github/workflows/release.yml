name: Release

# on every version tag push (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# builds and pushes dni/lnurl-mint to Docker Hub, and creates a GitHub
# Release with notes auto-generated from the commits/PRs since the previous
# tag. The docker job requires the repo secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (a Docker Hub access token, not the account password -
# create one at https://hub.docker.com/settings/security); github-release
# needs no extra secret, just the default GITHUB_TOKEN.
on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # from tag v1.2.0, produces the tags dni/lnurl-mint:1.2.0, :1.2,
      # :1, and :latest (docker/metadata-action's default semver pattern)
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dni/lnurl-mint
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: gh release create "$tag" --generate-notes
